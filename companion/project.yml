# AetherNX Companion, the iPhone and iPad app (docs/companion.md). XcodeGen project, as dm/ios's: companion/build.sh generates
# AetherNXCompanion.xcodeproj from it (not committed). Phase 1 needs no entitlement: the library is a folder the person picks.
name: AetherNXCompanion
options:
  bundleIdPrefix: io.github.icosisenpai
  deploymentTarget:
    iOS: "26.0"   # the game apps' own (dm/ios/project.yml)
  developmentLanguage: en
targets:
  AetherNXCompanion:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
        buildPhase: resources
    info:
      path: Gen/Info.plist
      properties:
        CFBundleDisplayName: AetherNX
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, it]
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIFileSharingEnabled: true            # the demo library, in Documents, visible in the Files app
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: io.github.icosisenpai.aethernx.companion
      PRODUCT_NAME: AetherNXCompanion
      MARKETING_VERSION: "0.1.0"
      CURRENT_PROJECT_VERSION: "1"
      TARGETED_DEVICE_FAMILY: "1,2"
      SWIFT_VERSION: "5.0"
      CODE_SIGN_STYLE: Automatic
      DEVELOPMENT_TEAM: ""                    # set to sign for a device; Simulator builds need none
      ENABLE_USER_SCRIPT_SANDBOXING: YES
      ASSETCATALOG_COMPILER_APPICON_NAME: ""
      LOCALIZATION_PREFERS_STRING_CATALOGS: NO
      SWIFT_EMIT_LOC_STRINGS: NO
schemes:
  AetherNXCompanion:
    build:
      targets:
        AetherNXCompanion: all
    run:
      config: Debug
